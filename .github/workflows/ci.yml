name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calender-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: calender-app

      - name: Lint
        run: npm run lint
        working-directory: calender-app

      - name: Build production bundle
        run: npm run build
        working-directory: calender-app
