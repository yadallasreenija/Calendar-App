name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - calender-app/package.json
      - calender-app/package-lock.json
  pull_request:
    branches: [main]
    paths:
      - calender-app/package.json
      - calender-app/package-lock.json
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: calender-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: calender-app

      - name: Audit dependencies
        run: npm audit --audit-level=high
        working-directory: calender-app
